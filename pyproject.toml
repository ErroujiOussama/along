[project]
name = "so101"
version = "0.1.0"
description = "Bimanual SO-101: robotd daemon, Python API, CLI and terminal panel"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lerobot[feetech]==0.7.0",
    "placo==0.12.0",          # kinematics (newer than lerobot's own placo extra allows)
    "opencv-python-headless",
    "numpy",
    "requests>=2.34.2",
    "silero-vad>=6.2.3",
    "jeepney>=0.9.0",
]

[tool.uv]
package = false
