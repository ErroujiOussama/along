<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>so101 cameras</title>
<style>
:root{--bg:#111;--fg:#ccc;--dim:#888;--line:#333;--acc:#e8a33d}
body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:6px 10px;flex-wrap:wrap}
header b{color:#fff} button{background:#222;color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:3px 9px;cursor:pointer}
button:hover{border-color:var(--acc)} img{width:100%;display:block}
#ctl{display:none;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;padding:10px}
#ctl.open{display:grid}
.cam{border:1px solid var(--line);border-radius:6px;padding:8px}
.cam h3{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.row{display:grid;grid-template-columns:185px 1fr 44px;gap:6px;align-items:center;margin:2px 0;font-size:12px}
.row.inactive{opacity:.4} .row input[type=range]{width:100%} .v{text-align:right;color:var(--dim)}
.saved{color:var(--acc)} #msg{color:var(--dim);font-size:12px}
</style></head><body>
<header><b>so101 cameras</b><span>left wrist (icSpring) · right wrist (Sonix) · scene (C920)</span>
<button id="tog">camera settings</button><span id="msg"></span></header>
<img id="cam" alt="live camera mosaic">
<div id="ctl"></div>
<script>
const ctl = document.getElementById('ctl'), msg = document.getElementById('msg'), cam = document.getElementById('cam');
(async function video() {   // poll single frames: survives hiccups, no refresh needed
  for (;;) {
    const t = performance.now();
    try {
      const r = await fetch('/frame.jpg?' + t, {cache: 'no-store'});
      if (r.ok) { const url = URL.createObjectURL(await r.blob()), old = cam.src; cam.src = url; if (old.startsWith('blob:')) URL.revokeObjectURL(old); }
    } catch (e) { await new Promise(r => setTimeout(r, 1000)); }
    await new Promise(r => setTimeout(r, Math.max(0, 80 - (performance.now() - t))));
  }
})();
const HINT = {auto_exposure: '1 = manual, 3 = auto', power_line_frequency: '1 = 50 Hz, 2 = 60 Hz'};
document.getElementById('tog').onclick = () => { ctl.classList.toggle('open'); if (ctl.classList.contains('open')) load(); };
if (location.hash === '#settings') { ctl.classList.add('open'); load(); }
let busy = false;   // don't redraw under a slider being dragged
ctl.addEventListener('pointerdown', () => busy = true); addEventListener('pointerup', () => setTimeout(() => busy = false, 300));
setInterval(() => { if (ctl.classList.contains('open') && !busy) load(); }, 2000);   // shows other viewers' changes
async function api(q) { const r = await fetch('/ctl?' + q); const j = await r.json(); if (j.error) throw new Error(j.error); return j; }
async function load() {
  try { const all = await api(''); ctl.innerHTML = ''; for (const [cam, r] of Object.entries(all)) ctl.append(panel(cam, r)); }
  catch (e) { msg.textContent = e.message; }
}
function panel(cam, r) {
  const d = document.createElement('div'); d.className = 'cam';
  d.innerHTML = `<h3>${cam}<button>reset to defaults</button></h3>`;
  d.querySelector('button').onclick = async () => { await set(cam, 'reset=1'); };
  if (r.error) { d.insertAdjacentHTML('beforeend', `<div class="v">${r.error}</div>`); return d; }
  for (const [k, c] of Object.entries(r.controls)) {
    const row = document.createElement('div'); row.className = 'row' + (c.inactive ? ' inactive' : '');
    row.title = (HINT[k] || '') + ` default ${c.default}` + (c.inactive ? ' (set by an auto mode)' : '');
    row.innerHTML = `<span class="${k in r.saved ? 'saved' : ''}">${k}</span>
      <input type="range" min="${c.min}" max="${c.max}" value="${c.value}"><span class="v">${c.value}</span>`;
    const [inp, v] = [row.querySelector('input'), row.querySelector('.v')];
    inp.oninput = () => v.textContent = inp.value;
    inp.onchange = () => set(cam, `${k}=${inp.value}`);
    d.append(row);
  }
  return d;
}
async function set(cam, kv) {
  try { await api(`cam=${cam}&${kv}`); msg.textContent = `${cam}: ${kv} saved`; load(); }
  catch (e) { msg.textContent = e.message; load(); }
}
</script></body></html>
