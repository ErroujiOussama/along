<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Al dashboard</title>
<style>
:root{--bg:#0e1013;--p1:#15181d;--p2:#1b1f26;--p3:#232833;--line:#2a303b;--fg:#d5d9e0;--dim:#8a93a3;--faint:#5c6573;
 --acc:#e8a33d;--ok:#3fb950;--bad:#f85149;--blue:#58a6ff;--vio:#c297ff;--cyan:#39c5cf;--me:#1d3a5f;--al:#232833}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
a{color:var(--blue)} button{font:inherit}
.mono,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
/* ---- top: state · now · arms · controls ---- */
#top{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px 14px;align-items:center;padding:8px 12px;background:var(--p1);border-bottom:1px solid var(--line)}
#pill{display:flex;flex-direction:column;justify-content:center;min-width:190px;padding:7px 14px;border-radius:10px;background:#333;color:#fff}
#pill b{font-size:20px;letter-spacing:.3px;white-space:nowrap} #pill small{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
#pill .vad{height:4px;margin-top:4px;background:#0005;border-radius:2px;overflow:hidden} #pill .vad i{display:block;height:100%;background:#fff;transition:width .2s}
#pill.down{background:#8b1d1d} #pill.off{background:#2b3038;color:#c8ccd3} #pill.listening{background:#1f6f34} #pill.speech{background:#1f5fae}
#pill.muted{background:#9a6a10} #pill.stt{background:#6b3fa8}
#now{min-width:0;display:flex;flex-direction:column;gap:3px;cursor:pointer}
#now .l1{display:flex;gap:8px;align-items:baseline;min-width:0}
#now .rq{color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#now .l2{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#now .l2 .cx{color:var(--acc)} #now .l2 code{color:#cfd6e0}
#arms{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--dim)}
#arms .arm{display:flex;gap:6px;align-items:center;white-space:nowrap} #arms .arm b{color:var(--fg);font-weight:600;width:44px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block} .dot.l{background:#e9edf2} .dot.r{background:#f08a24}
#ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--p2);color:var(--dim);border:0;padding:7px 14px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--ok);color:#06210d} .seg button.offon{background:#3a404b;color:#fff}
.btn{background:var(--p2);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc)} .btn.danger{color:#ffb4ae;border-color:#6b2a27} .btn.danger:hover{background:#4a1716}
.btn.sm{padding:3px 8px;font-size:12px}
.links{font-size:12px;display:flex;gap:10px}
/* ---- chips ---- */
.st{display:inline-block;font-size:11px;line-height:16px;padding:0 7px;border-radius:8px;border:1px solid var(--line);color:var(--dim);white-space:nowrap;font-weight:500}
.st.open{color:#111;background:var(--blue);border-color:var(--blue)} .st.asked{color:#111;background:var(--acc);border-color:var(--acc)}
.st.confirmed,.st.done{color:#06210d;background:var(--ok);border-color:var(--ok)} .st.failed,.st.dropped{color:#fff;background:var(--bad);border-color:var(--bad)}
.st.work{color:#111;background:var(--acc);border-color:var(--acc)} .st.hold{color:#06210d;background:var(--ok);border-color:var(--ok)}
/* ---- tabs + panes ---- */
#tabs{display:none;gap:2px;padding:4px 8px 0;background:var(--p1);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:7px 10px;cursor:pointer;white-space:nowrap}
.tab.on{color:#fff;border-bottom-color:var(--acc)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr) minmax(360px,440px);gap:0}
.pane{min-height:0;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.pane:last-child{border-right:0}
.ph{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--p1);min-height:38px}
.ph h2{margin:0;font-size:13px;color:#fff;font-weight:600} .ph .sub{color:var(--dim);font-size:12px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .tab{padding:4px 8px}
.scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
#p-scene,#p-skills,#p-raw{grid-column:3;grid-row:1} #p-chat{grid-column:1;grid-row:1} #p-tl{grid-column:2;grid-row:1}
.side{display:none} .side.show{display:flex}
@media (max-width:1099px){
 #top{grid-template-columns:auto minmax(0,1fr);}
 #arms{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;gap:4px 14px} #ctl{grid-column:1/-1;justify-content:flex-start}
 #tabs{display:flex} main{grid-template-columns:minmax(0,1fr)} .pane{grid-column:1 !important;grid-row:1 !important;display:none;border-right:0}
 .pane.show{display:flex} .sidetabs{display:none}
}
@media (max-width:560px){
 #top{padding:6px 8px;gap:6px 10px} #pill{min-width:0;padding:5px 10px} #pill b{font-size:16px} #pill small{max-width:150px}
 .links,.ph .sub{display:none} #now{grid-column:1/-1;order:3} #arms{grid-column:auto;flex-direction:column;order:2} #ctl{order:4} #arms .arm{white-space:normal;flex-wrap:wrap;font-size:11px;gap:2px 6px} #arms .arm b{width:auto} .btn{padding:5px 8px;font-size:13px} .seg button{padding:5px 11px}
}
/* ---- chat ---- */
#chat{padding:10px 10px 4px;display:flex;flex-direction:column;gap:2px}
#chat>div{display:flex;flex-direction:column}
.bub{max-width:86%;padding:6px 10px;border-radius:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.me{align-items:flex-end} .me .bub{background:var(--me);color:#e6f0ff;border-bottom-right-radius:4px}
.al{align-items:flex-start} .al .bub{background:var(--al);color:#fff;border-bottom-left-radius:4px}
.who{font-size:11px;color:var(--faint);margin:8px 6px 2px} .who .ty{color:var(--acc)}
.chat-sys{align-items:center} .chat-sys span{font-size:11px;color:var(--faint);margin:8px 0 4px}
.chat-sys.err span{color:var(--bad)}
.chatter .bub{background:none;border:1px dashed var(--line);color:var(--faint);font-size:12px;cursor:pointer;max-height:3.2em;overflow:hidden}
.chatter.open .bub{max-height:none}
.pend .bub{opacity:.65;font-style:italic}
#say{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);background:var(--p1)}
#say input{flex:1;min-width:0;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
#say input:focus{outline:none;border-color:var(--blue)}
/* ---- timeline ---- */
#tl{padding:8px 10px 20px;display:flex;flex-direction:column;gap:8px}
.card{border:1px solid var(--line);border-radius:10px;background:var(--p1);min-width:0}
.card.cur{border-color:#3b5a85}
.ch{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;padding:8px 10px;cursor:pointer;align-items:baseline}
.ch:hover{background:var(--p2);border-radius:10px}
.ch .t{color:var(--faint);font-size:12px} .ch .q{color:#fff;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.open .ch .q{white-space:normal}
.ch .m{color:var(--dim);font-size:12px;white-space:nowrap;text-align:right}
.ch .o{grid-column:2/-1;color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb{border-top:1px solid var(--line);padding:4px 0 6px}
.r{display:grid;grid-template-columns:58px 74px minmax(0,1fr);gap:8px;padding:3px 10px;align-items:baseline;font-size:13px}
.r .t{color:var(--faint);font-size:11px} .r .k{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--dim)}
.r .s{min-width:0;overflow-wrap:anywhere} .r.x>.s>.h{cursor:pointer} .r.x>.s>.h:hover{color:#fff}
.r .h{display:flex;gap:4px;min-width:0;align-items:baseline} .r .hb{flex:1;min-width:0} .r .h .car{color:var(--faint);font-size:10px;flex:none}
.r .one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.r.open .one{white-space:pre-wrap}
.r.sep{border-top:1px dashed var(--line);margin-top:4px;padding-top:6px}
.k-person .k{color:var(--blue)} .k-person .s{color:#cfe3ff}
.k-say .k{color:var(--ok)} .k-say .s{color:#fff}
.k-router .k{color:var(--blue)} .k-plan .k,.k-skill .k{color:var(--acc)} .k-check .k{color:var(--cyan)}
.k-fail .k,.k-error .k{color:var(--bad)} .k-error .s{color:#ffb4ae}
.k-task .k,.k-cmd .k,.k-codex .k{color:#79c0ff} .k-cmd .s{font-family:ui-monospace,monospace;font-size:12px;color:#e2e6ec}
.k-view .k,.k-look .k{color:var(--vio)} .k-learn .k{color:var(--ok)} .k-status .k{color:var(--dim)} .k-sys .s{color:var(--dim)} .k-call .k{color:var(--faint)}
.res{display:block;font-family:ui-monospace,monospace;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r.open .res{white-space:pre-wrap}
.res.bad{color:#ff8f87}
.acts{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:baseline}
.a{font-size:12px;padding:0 6px;border-radius:5px;background:var(--p3);color:#e6e9ee;font-family:ui-monospace,monospace;overflow-wrap:anywhere}
.a.codex{background:#1d3550;color:#9fd0ff} .a.skill{background:#4a3613;color:#ffd38a} .a.say{background:none;color:#cfe8cf;font-family:inherit;font-style:italic;padding:0}
.lab{font-size:10px;font-weight:700;color:#111;background:var(--dim);border-radius:4px;padding:0 4px;margin-right:4px;text-transform:uppercase}
.lab.new{background:var(--blue)} .lab.continue{background:#8fb3e8} .lab.confirm{background:var(--ok)} .lab.deny{background:var(--bad);color:#fff}
.sec{color:var(--faint);font-size:11px;margin-left:6px;white-space:nowrap}
.det{margin:6px 0 4px;padding:8px;background:#0a0c0f;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;gap:8px;font-size:12px}
.det .lb{color:var(--dim);font-size:11px;margin-bottom:2px}
.det pre{margin:0;max-height:340px;overflow:auto;font-size:11.5px;white-space:pre-wrap;overflow-wrap:anywhere;color:#d6dbe3}
.det details>summary{cursor:pointer;color:var(--dim);font-size:11px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap} .thumbs a{display:flex;flex-direction:column;font-size:11px;color:var(--dim);text-decoration:none}
.thumbs img{width:150px;max-width:28vw;border:1px solid var(--line);border-radius:4px;background:#000}
.ids{color:var(--faint);font-size:10px;overflow-wrap:anywhere}
.empty{color:var(--dim);padding:20px;text-align:center}
/* ---- scene / skills / raw ---- */
#scenebox{padding:10px;display:flex;flex-direction:column;gap:10px}
#scene{width:100%;aspect-ratio:16/9;display:block;border-radius:8px;background:#000;object-fit:contain}
.legend{font-size:11px;color:var(--dim)} .legend i{font-style:normal;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12px} td,th{padding:3px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:normal} tr.new td:first-child{color:var(--ok)}
.kv{font-size:12px;color:var(--dim)} .kv b{color:var(--fg);font-weight:500}
#skills{padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.sk{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--p1)}
.sk .nm{color:#fff;font-weight:600;font-family:ui-monospace,monospace} .sk .uw{color:var(--fg);font-size:13px;margin-top:2px}
.sk .ar{color:var(--dim);font-family:ui-monospace,monospace;font-size:11px;margin-top:2px;overflow-wrap:anywhere}
.sk .ss{font-size:11px;color:var(--dim);margin-top:3px} .w{color:var(--ok)} .f{color:var(--bad)}
.sk.learned{border-color:#5a4520} .sk.learned .hd{cursor:pointer}
.tag{font-size:10px;padding:0 6px;border-radius:7px;background:var(--acc);color:#111;margin-left:6px;font-family:system-ui} .tag.d{background:var(--p3);color:var(--dim)}
.sk pre{margin:6px 0 0;max-height:420px;overflow:auto;font-size:11.5px;background:#0a0c0f;padding:8px;border-radius:6px;white-space:pre-wrap}
.grp-h{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin:8px 2px 0}
#rawlog{margin:0;padding:8px 10px;font-size:11.5px;white-space:pre-wrap;overflow-wrap:anywhere;color:#cdd3dc}
.ev{display:grid;grid-template-columns:58px 60px minmax(0,1fr);gap:6px;font-size:11.5px;padding:1px 10px;font-family:ui-monospace,monospace}
.ev .t,.ev .k{color:var(--faint)} .ev .x{overflow-wrap:anywhere;white-space:pre-wrap}
#rawfilter{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;width:140px}
</style></head><body>
<div id="top">
 <div id="pill" class="off"><b>…</b><small></small><div class="vad"><i style="width:0"></i></div></div>
 <div id="now" title="click: show this episode in the timeline"><div class="l1"><span class="rq">…</span></div><div class="l2"></div></div>
 <div id="arms"></div>
 <div id="ctl">
  <div class="seg" title="voice session"><button id="on">ON</button><button id="off">OFF</button></div>
  <button class="btn" id="open" title="open both grippers">Release grips</button>
  <button class="btn" id="fresh" title="Codex starts over with only its brief: forgets this conversation (arms stay put)">Reset Al</button>
  <button class="btn danger" id="reset" title="stop Al, open both grippers, move both arms to rest">Reset arms</button>
  <span class="links"><a href="/">cameras</a><a href="/inspect">inspector</a></span>
 </div>
</div>
<nav id="tabs"><button class="tab" data-tab="chat">Chat</button><button class="tab" data-tab="tl">Timeline</button><button class="tab" data-tab="scene">Scene</button><button class="tab" data-tab="skills">Actions</button><button class="tab" data-tab="raw">Raw log</button></nav>
<main>
 <section class="pane" id="p-chat">
  <div class="ph"><h2>Conversation</h2><span class="sub" id="chatsub">person ↔ Al</span></div>
  <div class="scroll" id="chatsc"><div id="chat"></div></div>
  <form id="say"><input id="txt" placeholder="Type as if spoken to Al…" autocomplete="off"><button class="btn" data-cmd="voice" title="handled exactly like speech">Send</button><button class="btn" data-cmd="say" title="Al speaks this text">Speak</button></form>
 </section>
 <section class="pane" id="p-tl">
  <div class="ph"><h2>Why did it do that?</h2><span class="sub" id="tlsub">episodes: router → skills → checks → Codex → outcome · click a row for the exact model call</span></div>
  <div class="scroll" id="tlsc"><div id="tl"></div></div>
 </section>
 <section class="pane side" id="p-scene">
  <div class="ph sidetabs"><button class="tab" data-side="scene">Scene</button><button class="tab" data-side="skills">Actions</button><button class="tab" data-side="raw">Raw log</button></div>
  <div class="scroll"><div id="scenebox">
   <img id="scene" alt="scene camera with detection boxes">
   <div class="legend" id="legend"><i style="color:#3cdc3c">green</i> new (wakes it) · <i style="color:#e6aa3c">orange</i> known · <i style="color:#c83cc8">magenta</i> on an arm (ignored) · <i style="color:#3cc8e6">cyan</i> wake zone · <i style="color:#888">grey</i> idle baseline</div>
   <div class="kv" id="snap"></div>
   <div id="detwrap"><table><thead><tr><th>label</th><th>conf</th><th>px (locate)</th><th>box</th></tr></thead><tbody id="dets"></tbody></table>
    <div style="display:flex;gap:6px;margin-top:8px"><button class="btn sm" id="wake">Force wake</button><button class="btn sm" id="idle" title="clear the table first">Store idle baseline</button></div></div>
  </div></div>
 </section>
 <section class="pane side" id="p-skills">
  <div class="ph sidetabs"><button class="tab" data-side="scene">Scene</button><button class="tab" data-side="skills">Actions</button><button class="tab" data-side="raw">Raw log</button></div>
  <div class="ph"><h2>Actions</h2><span class="sub" id="skstat"></span></div>
  <div class="scroll"><div id="skills"></div></div>
 </section>
 <section class="pane side" id="p-raw">
  <div class="ph sidetabs"><button class="tab" data-side="scene">Scene</button><button class="tab" data-side="skills">Actions</button><button class="tab" data-side="raw">Raw log</button></div>
  <div class="ph"><span class="seg"><button id="rw-codex" class="on">Codex log</button><button id="rw-ev">All events</button></span><input id="rawfilter" placeholder="filter" style="margin-left:auto"></div>
  <div class="scroll" id="rawsc"><pre id="rawlog"></pre><div id="rawev" hidden></div></div>
 </section>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const hm = t => new Date(t * 1000).toTimeString().slice(0, 8);
const hmm = t => new Date(t * 1000).toTimeString().slice(0, 5);
const now = () => Date.now() / 1000;
const ago = t => { const s = now() - t; return s < 90 ? Math.max(0, s).toFixed(0) + ' s' : s < 5400 ? (s / 60).toFixed(0) + ' min' : s < 172800 ? (s / 3600).toFixed(0) + ' h' : (s / 86400).toFixed(0) + ' d'; };
const dur = s => s < 90 ? s.toFixed(0) + ' s' : (s / 60).toFixed(1) + ' min';
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
const doit = (cmd, text) => fetch('/along/do?' + new URLSearchParams({cmd, ...(text ? {text} : {})}));

// ---------- keyed DOM: reuse elements by key, touch innerHTML only when it changed ----------
function reconcile(box, items, make) {
  const m = box._k || (box._k = new Map()), keep = new Set();
  let prev = null;
  for (const it of items) {
    let el = m.get(it.key);
    if (!el) { el = make ? make(it) : document.createElement('div'); m.set(it.key, el); }
    if (it.cls != null && el.className !== it.cls) el.className = it.cls;
    if (it.html != null && el._h !== it.html) { el.innerHTML = it.html; el._h = it.html; }
    if (it.update) it.update(el);
    const want = prev ? prev.nextSibling : box.firstChild;
    if (want !== el) box.insertBefore(el, want);
    prev = el; keep.add(it.key);
  }
  for (const [k, el] of m) if (!keep.has(k)) { el.remove(); m.delete(k); }
}
const atBottom = sc => sc.scrollTop + sc.clientHeight > sc.scrollHeight - 40;

// ---------- layout: tabs (narrow) / side tabs (wide) ----------
const narrowQ = matchMedia('(max-width:1099px)');
let tab = 'tl', side = 'scene';
try { tab = localStorage.getItem('al.tab') || tab; side = localStorage.getItem('al.side') || side; } catch (e) {}
function layout() {
  const panes = {chat: 'p-chat', tl: 'p-tl', scene: 'p-scene', skills: 'p-skills', raw: 'p-raw'};
  for (const [k, id] of Object.entries(panes)) {
    const show = narrowQ.matches ? k === tab : (k === 'chat' || k === 'tl' || k === side);
    $(id).classList.toggle('show', show);
  }
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  document.querySelectorAll('[data-side]').forEach(b => b.classList.toggle('on', b.dataset.side === side));
  try { localStorage.setItem('al.tab', tab); localStorage.setItem('al.side', side); } catch (e) {}
  for (const sc of [$('chatsc'), $('tlsc')]) sc.scrollTop = 1e9;
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; if (['scene', 'skills', 'raw'].includes(tab)) side = tab; layout(); }
  const s = e.target.closest('[data-side]'); if (s) { side = s.dataset.side; layout(); }
});
narrowQ.addEventListener('change', layout);
layout();
const sceneVisible = () => !document.hidden && $('p-scene').classList.contains('show');

// ---------- data ----------
let D = null, C = {calls: [], episodes: {}, instr: {}}, callSig = '', evSig = '', dirty = true;
const openRows = new Set(), cardOpen = new Map();
let lastCards = [];

// ---------- parsing events ----------
function tail(s) { const i = s.search(/[\[{]/); if (i < 0) return null; try { const j = JSON.parse(s.slice(i)); return Array.isArray(j) ? j : j.actions || [j]; } catch (e) { return null; } }
function parseRoute(text) {
  const m = text.match(/^\(([\d.]+) s\)\s*(?:([a-z]+): )?/), rest = m ? text.slice(m[0].length) : text;
  const i = rest.search(/[\[{]/);
  return {secs: m?.[1], label: m?.[2], sum: (i < 0 ? rest : rest.slice(0, i)).trim(), acts: tail(rest)};

  if (d.arms?.error) ah = `<span style="color:var(--bad)">arms: ${esc(d.arms.error)}</span>`;
  else ah = ['left', 'right'].map(k => { const a = d.arms?.[k]; if (!a) return '';
    return `<span class="arm"><span class="dot ${k[0]}"></span><b>${k}</b>grip ${Math.round(a.gripper_target)}%${a.holding ? ' <span class="st hold">HOLDING</span>' : ''}${s?.held?.[k] ? ` <span class="st hold">holds ${esc(s.held[k])}</span>` : ''} · tip ${a.tip.map(v => v.toFixed(2)).join(' ')}</span>`; }).join('');
  if ($('arms')._h !== ah) { $('arms').innerHTML = ah; $('arms')._h = ah; }
  $('chatsub').textContent = s ? (s.voice ? s.voice + ' · ' : '') + (s.active ? 'listening' : 'mic off') : '';
}
$('now').onclick = () => { if (narrowQ.matches) { tab = 'tl'; layout(); } const c = lastCards[lastCards.length - 1]; if (c) { cardOpen.set(c.key, true); renderTimeline(); $('tlsc').scrollTop = 1e9; } };

// ---------- scene tab ----------
function renderScene() {
  const d = D, s = d.seen, man = !!s?.manual;
  $('legend').hidden = $('detwrap').hidden = man;
  const snap = s?.state_t ? `arm snapshot ${(d.now - s.state_t).toFixed(0)} s old: <b>${esc(s.state || '')}</b>` : 'no arm snapshot (only while ON)';
  const sh = snap + (man ? '' : ` · ${(d.idle || []).length} baseline boxes · new-object hits ${(s?.hits || []).filter(Boolean).length}/4 (3 wake)`);
  if ($('snap')._h !== sh) { $('snap').innerHTML = sh; $('snap')._h = sh; }
  if (!man) {
    const nb = new Set((s?.new || []).map(x => x.box.join()));
    const h = (s?.all || []).map(x => `<tr class="${nb.has(x.box.join()) ? 'new' : ''}"><td>${esc(x.label)}</td><td>${x.conf.toFixed(2)}</td><td>${x.px.join(', ')}</td><td>${x.box.join(' ')}</td></tr>`).join('');
    if ($('dets')._h !== h) { $('dets').innerHTML = h; $('dets')._h = h; }
  }
}
(async function scene() { for (;;) { if (sceneVisible()) { try {
  const r = await fetch('/along/scene.jpg?' + Date.now(), {cache: 'no-store'});
  if (r.ok) { const u = URL.createObjectURL(await r.blob()), o = $('scene').src; $('scene').src = u; if (o.startsWith('blob:')) URL.revokeObjectURL(o); }
} catch (e) {} } await new Promise(r => setTimeout(r, 450)); } })();

// ---------- raw log tab ----------
let rawMode = 'codex';
$('rw-codex').onclick = () => { rawMode = 'codex'; $('rw-codex').className = 'on'; $('rw-ev').className = ''; renderRaw(true); };
$('rw-ev').onclick = () => { rawMode = 'ev'; $('rw-ev').className = 'on'; $('rw-codex').className = ''; renderRaw(true); };
$('rawfilter').oninput = () => renderRaw(true);
function renderRaw(force) {
  if (!D || !$('p-raw').classList.contains('show')) return;
  const sc = $('rawsc'), stick = force || atBottom(sc), f = $('rawfilter').value.trim().toLowerCase();
  $('rawlog').hidden = rawMode !== 'codex'; $('rawev').hidden = rawMode === 'codex';
  if (rawMode === 'codex') {
    let t = D.codex_log || '(no Codex turn yet: it runs only when the router hands a task over)';
    if (f) t = t.split('\n').filter(l => l.toLowerCase().includes(f)).join('\n');
    if ($('rawlog').textContent !== t) $('rawlog').textContent = t;
  } else {
    const seq = {};
    reconcile($('rawev'), D.events.filter(e => !f || (e.kind + ' ' + e.text).toLowerCase().includes(f)).slice(-400).map(e => { const b = 'e' + e.t + e.kind; return {key: b + '_' + (seq[b] = (seq[b] || 0) + 1), cls: 'ev',
      html: `<span class="t">${hm(e.t)}</span><span class="k">${esc(e.kind)}</span><span class="x">${esc(e.text)}</span>`}; }));
  }
  if (stick) sc.scrollTop = 1e9;
}

// ---------- skills / actions ----------
const openSk = new Set(); let skSig = '', skData = null;
function stats(s) {
  if (!s) return '';
  const last = Math.max(s.last_patch || 0, s.created || 0);
  return `${s.uses ?? 0} uses · <span class="w">✓ ${s.wins ?? 0}</span> <span class="f">✗ ${s.fails ?? 0}</span> · ${s.patches ?? 0} patches${last ? ' · changed ' + ago(last) + ' ago' : ''}${s.last_used ? ' · used ' + ago(s.last_used) + ' ago' : ''}`;
}
const argsTxt = a => !a ? '' : typeof a === 'string' ? a : Array.isArray(a) ? a.map(x => typeof x === 'string' ? x : x.name || JSON.stringify(x)).join(', ') : Object.keys(a).join(', ');
function renderSkills(d) {
  if (d.error) { $('skills').innerHTML = `<div class="empty">skills unavailable: ${esc(d.error)}</div>`; return; }
  let h = `<div class="grp-h">learned (${(d.skills || []).length})</div>`;
  for (const s of d.skills || []) {
    const op = openSk.has(s.name);
    h += `<div class="sk learned"><div class="hd" data-sk="${esc(s.name)}"><span class="nm">${op ? '▾' : '▸'} ${esc(s.name)}</span><span class="tag">learned</span>${s.direct ? '<span class="tag d">direct</span>' : ''}
      <div class="uw">${esc(s.use_when || '')}</div>${s.args ? `<div class="ar">${esc(argsTxt(s.args))}</div>` : ''}<div class="ss">${stats(s.stats)}</div></div>`
      + (op ? `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px"><span class="ss" style="margin:0">${esc(s.path || '')} · ${(s.history || []).length} snapshots</span><button class="btn sm" data-undo="${esc(s.name)}" ${(s.history || []).length ? '' : 'disabled'}>Undo last change</button></div><pre>${esc(s.body || '')}</pre>` : '') + '</div>';
  }
  if (!(d.skills || []).length) h += '<div class="empty" style="padding:8px">none yet: a confirmed episode creates one</div>';
  h += `<div class="grp-h">built-in (${(d.builtins || []).length})</div>`;
  h += (d.builtins || []).map(b => `<div class="sk"><span class="nm">${esc(b.name)}</span><div class="uw">${esc(b.use_when || '')}</div>${b.args ? `<div class="ar">${esc(argsTxt(b.args))}</div>` : ''}</div>`).join('');
  $('skills').innerHTML = h;
  $('skstat').textContent = `${(d.builtins || []).length} built-in · ${(d.skills || []).length} learned`;
}
$('skills').onclick = e => {
  const u = e.target.closest('[data-undo]');
  if (u) { if (confirm(`Undo the last change to skill "${u.dataset.undo}"?`)) doit('skill-undo', u.dataset.undo).then(() => setTimeout(pollSkills, 800, true)); return; }
  const r = e.target.closest('[data-sk]'); if (!r) return;
  const n = r.dataset.sk; openSk.has(n) ? openSk.delete(n) : openSk.add(n);
  if (skData) renderSkills(skData);
};
async function pollSkills(once) {
  try {
    const t = await (await fetch('/along/skills.json', {cache: 'no-store'})).text();
    if (t !== skSig) { skSig = t; skData = JSON.parse(t); renderSkills(skData); }
  } catch (e) { $('skills').innerHTML = '<div class="empty">skills: unavailable</div>'; skSig = ''; }
  if (!once) setTimeout(pollSkills, 5000);
}

// ---------- polling ----------
async function poll() {
  try {
    D = await (await fetch('/along.json', {cache: 'no-store'})).json();
    const ev = D.events, sig = ev.length + ':' + (ev.length ? ev[ev.length - 1].t + ev[0].t : '');
    if (sig !== evSig) { evSig = sig; dirty = true; renderChat(); }
    if (dirty) { dirty = false; renderTimeline(); }
    renderTop(); renderScene(); renderRaw();
  } catch (e) {
    const p = $('pill'); p.className = 'down'; p.children[0].textContent = 'NO DASHBOARD'; p.children[1].textContent = 'stream server unreachable';
  }
  setTimeout(poll, 700);
}
async function pollCalls() {
  try {
    const d = await (await fetch('/along/calls.json?' + new URLSearchParams({n: 200, sig: callSig}), {cache: 'no-store'})).json();
    if (!d.error && !d.same) { callSig = d.sig; C = d; dirty = true; if (D) { dirty = false; renderTimeline(); } }
  } catch (e) {}
  setTimeout(pollCalls, 3000);
}
setInterval(() => { if (D) renderTimeline(); }, 15000);   // refresh "x min ago"
poll(); pollCalls(); pollSkills();

// ---------- controls ----------
$('say').onsubmit = e => { e.preventDefault(); const t = $('txt').value.trim(), c = e.submitter?.dataset.cmd || 'voice';
  if (!t) return; doit(c === 'voice' ? 'tell' : 'say', c === 'voice' ? '[voice] ' + t : t); $('txt').value = ''; };
$('on').onclick = () => doit('on'); $('off').onclick = () => doit('off');
$('open').onclick = () => doit('open');
$('reset').onclick = () => confirm('Stop Al, open both grippers and move both arms to rest?') && doit('reset');
$('fresh').onclick = () => confirm('Reset Al? Codex forgets this conversation; the next task starts from only its brief (arms stay put).') && doit('fresh');
$('wake').onclick = () => doit('wake');
$('idle').onclick = () => confirm('Store what the scene shows now as the idle baseline?') && doit('idle');
